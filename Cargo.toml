[package]
name = "mg-remindr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bootstrap for a planned local-first todo authority"
license = "MIT"

[lib]
name = "mg_remindr"
path = "src/lib.rs"

[[bin]]
name = "mg-remindr"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
# the suite's SQLite version
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
