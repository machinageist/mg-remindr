[package]
name = "mg-todo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bootstrap for a planned local-first todo authority"

[lib]
name = "mg_todo"
path = "src/lib.rs"

[[bin]]
name = "mg-todo"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
